<div class="form-container">
  <div class="form-header">
    <div>
      <h2>Nova tarefa</h2>
      <p>Adicione uma tarefa ao seu quadro de trabalho.</p>
    </div>
    <span class="form-icon">+</span>
  </div>

  <form (ngSubmit)="createTarefa()">
    <div class="form-group">
      <label for="title">Título da tarefa *</label>
      <input
        id="title"
        type="text"
        placeholder="Ex.: Implementar autenticação"
        [(ngModel)]="tarefa.title"
        name="title"
        required
      />
    </div>

    <div class="form-group">
      <label for="description">Descrição</label>
      <textarea
        id="description"
        placeholder="Descreva o que precisa ser feito..."
        [(ngModel)]="tarefa.description"
        name="description"
        rows="4"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="status">Status inicial</label>
      <select id="status" [(ngModel)]="tarefa.status" name="status">
        <option value="Em Espera">Em Espera</option>
        <option value="Em Andamento">Em Andamento</option>
        <option value="Em Teste">Em Teste</option>
        <option value="Concluída">Concluída</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">+ Criar tarefa</button>
    </div>
  </form>
</div>
